name: Build The Film App (Mobile)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Generate Native Android & iOS Wrappers
        run: flutter create --platforms=android,ios --org com.thefilmapp .

      - name: Get Dependencies
        run: flutter pub get

      - name: Verify Code Quality
        run: flutter analyze || true

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: the-film-app-android-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      # 1. Official Tagged Release (Triggers when pushing v1.0.0, etc.)
      - name: Publish Tagged GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 2. Continuous Rolling Release (Triggers on pushes to main without tags)
      - name: Publish Latest Rolling Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          name: Latest Build (Continuous)
          tag_name: latest
          body: |
            ## 📷 The Film App - Latest Android APK
            Continuous build from branch `main` (${{ github.sha }}).
            Download `app-release.apk` below and install it directly on your Android device.
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
